# -------------------------------------------------
# Project-wide Gradle settings
# -------------------------------------------------

# JVM arguments used for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8


# -------------------------------------------------
# Android configuration
# -------------------------------------------------

# Enable AndroidX support
android.useAndroidX=true

# Use non-transitive R classes to reduce R size
android.nonTransitiveRClass=true


# -------------------------------------------------
# Kotlin configuration
# -------------------------------------------------

# Kotlin code style: "official" or "obsolete"
kotlin.code.style=official


# -------------------------------------------------
# Optional / commented settings
# -------------------------------------------------

# Enable parallel project execution (advanced use only)
# org.gradle.parallel=true

# Explicit Java home (uncomment if needed)
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.17.10-hotspot
